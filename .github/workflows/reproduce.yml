name: Fresh scientific reproduction
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify exact published payload
        run: python3 scripts/unpack.py --verify-only
      - name: Install from registries and reproduce scored outcomes
        run: bash scripts/reproduce.sh
